<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>V4 Dashboard</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            background-color: #1c1c1e;
            color: #ffffff;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            margin: 0;
            padding: 20px;
            box-sizing: border-box;
        }
        .card {
            background-color: #2c2c2e;
            border-radius: 16px;
            padding: 24px;
            width: 100%;
            max-width: 350px;
            box-shadow: 0 8px 24px rgba(0,0,0,0.3);
            text-align: center;
        }
        .pair-title {
            font-size: 28px;
            font-weight: bold;
            margin-bottom: 12px;
        }
        .badge {
            display: inline-block;
            padding: 8px 20px;
            border-radius: 20px;
            font-size: 18px;
            font-weight: bold;
            text-transform: uppercase;
            margin-bottom: 20px;
        }
        .badge-buy { background-color: #34c759; color: #ffffff; }
        .badge-sell { background-color: #ff3b30; color: #ffffff; }
        .badge-warning { background-color: #ff9500; color: #ffffff; }
        .btn {
            background-color: #007aff;
            color: white;
            border: none;
            padding: 12px 24px;
            font-size: 16px;
            font-weight: 600;
            border-radius: 12px;
            cursor: pointer;
            width: 100%;
            transition: background-color 0.2s;
        }
        .btn:active {
            background-color: #0056b3;
        }
    </style>
</head>
<body>

    <div class="card">
        <div id="pair" class="pair-title">--</div>
        <div id="direction" class="badge badge-warning">WAIT</div>
        <button class="btn" onclick="refreshData()">🔄 Refresh</button>
    </div>

    <script>
        // Init Telegram WebApp
        const tg = window.Telegram.WebApp;
        tg.expand();

        async function refreshData() {
            const btn = document.querySelector('.btn');
            btn.innerText = '⏳ Updating...';

            try {
                // Link Sahihi ya Render kutoka kwenye picha yako
                const response = await fetch('https://v4-dashboard.onrender.com/api/data');
                const data = await response.json();

                // 1. Update Pair & Direction
                document.getElementById('pair').innerText = data.pair || '--';
                document.getElementById('direction').innerText = data.direction || '--';

                // 2. Update Badge Color
                const dirElement = document.getElementById('direction');
                if (data.direction && data.direction.toUpperCase() === 'BUY') {
                    dirElement.className = 'badge badge-buy';
                } else if (data.direction && data.direction.toUpperCase() === 'SELL') {
                    dirElement.className = 'badge badge-sell';
                } else {
                    dirElement.className = 'badge badge-warning';
                }

                btn.innerText = '🔄 Refresh';
            } catch (error) {
                console.error("Error fetching data:", error);
                btn.innerText = '❌ Error!';
            }
        }

        // Auto Load Data Unapofungua Dashboard
        refreshData();
    </script>
</body>
</html>
