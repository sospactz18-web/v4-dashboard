<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>V4 OTC Pro Signal Engine</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background-color: #0d0e12;
            color: #ffffff;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 16px;
        }
        .card {
            background: #181920;
            border: 1px solid #2a2c38;
            border-radius: 24px;
            padding: 24px;
            width: 100%;
            max-width: 380px;
            box-shadow: 0 12px 40px rgba(0,0,0,0.6);
            text-align: center;
        }
        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 12px;
            color: #8a8d9b;
            margin-bottom: 16px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }
        .live-dot {
            height: 8px;
            width: 8px;
            background-color: #22c55e;
            border-radius: 50%;
            display: inline-block;
            box-shadow: 0 0 8px #22c55e;
        }
        .pair-title {
            font-size: 26px;
            font-weight: 800;
            margin-bottom: 12px;
            color: #ffffff;
            letter-spacing: 0.5px;
        }
        .badge {
            display: inline-block;
            padding: 12px 32px;
            border-radius: 30px;
            font-size: 22px;
            font-weight: 900;
            letter-spacing: 1.5px;
            margin-bottom: 20px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.3);
        }
        .badge-buy { background: linear-gradient(135deg, #22c55e, #16a34a); color: #ffffff; }
        .badge-sell { background: linear-gradient(135deg, #ef4444, #dc2626); color: #ffffff; }
        .badge-warning { background: linear-gradient(135deg, #f59e0b, #d97706); color: #ffffff; }

        /* Timer Box */
        .timer-box {
            background: rgba(255,255,255,0.03);
            border: 1px dashed #3b3e52;
            border-radius: 14px;
            padding: 12px;
            margin-bottom: 20px;
        }
        .timer-label { font-size: 11px; color: #9ca3af; text-transform: uppercase; }
        .timer-clock { font-size: 24px; font-weight: 800; color: #38bdf8; margin-top: 2px; }

        /* Grid */
        .stats-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
            margin-bottom: 20px;
        }
        .stat-box {
            background-color: #21232d;
            padding: 12px;
            border-radius: 14px;
            border: 1px solid #2d303e;
            text-align: left;
        }
        .stat-label { font-size: 10px; color: #8a8d9b; text-transform: uppercase; }
        .stat-value { font-size: 15px; font-weight: 700; color: #ffffff; margin-top: 2px; }

        /* Buttons */
        .btn-main {
            background: linear-gradient(135deg, #2563eb, #1d4ed8);
            color: white;
            border: none;
            padding: 16px;
            font-size: 16px;
            font-weight: 700;
            border-radius: 16px;
            cursor: pointer;
            width: 100%;
            box-shadow: 0 4px 15px rgba(37, 99, 235, 0.4);
            transition: all 0.2s;
        }
        .btn-main:active { transform: scale(0.98); }
    </style>
</head>
<body>

    <div class="card">
        <div class="header">
            <span><span class="live-dot"></span> V4 ENGINE LIVE</span>
            <span id="current-time">00:00:00</span>
        </div>

        <div id="pair" class="pair-title">--</div>
        <div id="direction" class="badge badge-warning">WAITING...</div>

        <!-- Timer ya kuingia Trade -->
        <div class="timer-box">
            <div class="timer-label">⏱️ SOMA SHOT / CANDLE TIMER</div>
            <div id="timer" class="timer-clock">00:00</div>
        </div>

        <!-- Grid ya Taarifa za Usahihi -->
        <div class="stats-grid">
            <div class="stat-box">
                <div class="stat-label">Timeframe</div>
                <div id="timeframe" class="stat-value">--</div>
            </div>
            <div class="stat-box">
                <div class="stat-label">Accuracy Rate</div>
                <div id="accuracy" class="stat-value" style="color: #22c55e;">--</div>
            </div>
            <div class="stat-box">
                <div class="stat-label">Signal Quality</div>
                <div id="quality" class="stat-value" style="color: #38bdf8;">--</div>
            </div>
            <div class="stat-box">
                <div class="stat-label">Action Status</div>
                <div id="action" class="stat-value" style="color: #f59e0b;">--</div>
            </div>
        </div>

        <button class="btn-main" onclick="refreshData()">🔄 ANCHOR NEW SIGNAL</button>
    </div>

    <!-- Sauti ya Notification wakati Signal Mpya Inapoingia -->
    <audio id="alertSound" src="https://assets.mixkit.co/active_storage/sfx/2869/2869-preview.mp3" preload="auto"></audio>

    <script>
        const tg = window.Telegram.WebApp;
        tg.expand();

        let audio = document.getElementById('alertSound');

        // Saa ya Mfumo
        setInterval(() => {
            const now = new Date();
            document.getElementById('current-time').innerText = now.toLocaleTimeString();
            
            // Countdown ya sekunde 60 (Candle Timer)
            const secondsLeft = 60 - now.getSeconds();
            document.getElementById('timer').innerText = `00:${secondsLeft < 10 ? '0' : ''}${secondsLeft}s`;
        }, 1000);

        async function refreshData() {
            const btn = document.querySelector('.btn-main');
            btn.innerText = '⏳ ANALYZING MARKET...';

            try {
                const response = await fetch('https://v4-dashboard.onrender.com/api/data');
                const data = await response.json();

                // Jaza Taarifa
                document.getElementById('pair').innerText = data.pair || '--';
                document.getElementById('direction').innerText = data.direction || 'WAIT';
                document.getElementById('timeframe').innerText = data.timeframe || 'M1';
                document.getElementById('accuracy').innerText = data.accuracy || '90%+';
                document.getElementById('quality').innerText = data.quality || 'HIGH';
                document.getElementById('action').innerText = data.action || 'ENTRY READY';

                // Badilisha Rangi na Piga Sauti ya Alert
                const dirElement = document.getElementById('direction');
                if (data.direction && data.direction.toUpperCase() === 'BUY') {
                    dirElement.className = 'badge badge-buy';
                    audio.play().catch(() => {}); // Piga kengele ya signal
                } else if (data.direction && data.direction.toUpperCase() === 'SELL') {
                    dirElement.className = 'badge badge-sell';
                    audio.play().catch(() => {}); // Piga kengele ya signal
                } else {
                    dirElement.className = 'badge badge-warning';
                }

                btn.innerText = '🔄 ANCHOR NEW SIGNAL';
            } catch (error) {
                console.error("Error fetching data:", error);
                btn.innerText = '❌ ERROR RETRIEVING';
            }
        }

        // Auto load mara ya kwanza
        refreshData();
    </script>
</body>
</html>
